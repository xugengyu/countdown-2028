<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a0d">
  <meta name="description" content="Time until liftoff. November 15, 2028, midnight Pacific.">
  <title>Time Until Liftoff</title>
  <style>
    :root { color-scheme: dark; font-family: "Consolas", "SFMono-Regular", monospace; color: #fff; background: #070a0d; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .background, .shade { position: fixed; inset: 0; width: 100%; height: 100%; }
    .background { left: auto; right: 0; width: min(100vw, 177.78svh); object-fit: contain; opacity: .76; mask-image: linear-gradient(90deg, transparent, #000 28%); }
    .shade { background: linear-gradient(180deg, #03070b7a, #03070b66 40%, #03070bd9), linear-gradient(90deg, #03070b88, transparent 80%); }
    main { position: relative; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 60px 7%; }
    h1 { margin: 0 0 36px; font-size: clamp(11px, 1.4vw, 17px); font-weight: 400; letter-spacing: .3em; color: #c7d5db; }
    h1::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 15px; border-radius: 50%; background: #d6f2b3; box-shadow: 0 0 13px #d6f2b355; vertical-align: 2px; }
    .timer { display: flex; align-items: baseline; gap: clamp(8px, 1.5vw, 22px); width: min(100%, 1180px); font-variant-numeric: tabular-nums; text-shadow: 0 2px 32px #0008; }
    .prefix { font-size: clamp(23px, 4.6vw, 65px); color: #d6f2b3; font-weight: 400; }
    .unit { display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .digits { font-size: clamp(42px, 8vw, 118px); line-height: 1; font-weight: 700; letter-spacing: -.055em; }
    .label { margin-top: 22px; font-size: clamp(8px, .9vw, 12px); font-weight: 400; letter-spacing: .23em; color: #b1c1ca; }
    .separator { font-size: clamp(24px, 5vw, 72px); color: #a0b6bd88; align-self: flex-start; line-height: 1.3; }
    .seconds .digits { color: #d6f2b3; }
    .liftoff { font-size: clamp(50px, 12vw, 150px); letter-spacing: -.06em; color: #d6f2b3; margin: 0; }
    [hidden] { display: none !important; }
    .motion { position: fixed; right: 25px; bottom: 25px; display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #ffffff35; border-radius: 50%; color: #dce5e8; background: #03070b66; cursor: pointer; }
    .motion:hover { background: #ffffff20; }
    .motion:focus-visible { outline: 2px solid #d6f2b3; outline-offset: 5px; }
    .motion svg { width: 15px; height: 15px; fill: currentColor; }
    @media(max-width:700px) {
      main { align-items: center; padding: 50px 5%; }
      h1 { font-size: 10px; letter-spacing: .2em; margin-bottom: 28px; }
      .timer { justify-content: center; gap: 6px; }
      .digits { font-size: clamp(30px, 8.4vw, 58px); }
      .prefix { font-size: clamp(16px, 4.2vw, 28px); }
      .separator { font-size: clamp(18px, 4.5vw, 30px); }
      .label { font-size: 7px; letter-spacing: .12em; margin-top: 15px; }
      .background { top: 50%; height: auto; aspect-ratio: 16 / 9; transform: translateY(-50%); mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); }
      .motion { right: 18px; bottom: 18px; }
    }
  </style>
</head>
<body>
  <img class="background" id="background" src="./falcon-venting-still.jpg" alt="" aria-hidden="true">
  <div class="shade" aria-hidden="true"></div>
  <main>
    <h1>TIME UNTIL LIFTOFF</h1>
    <div class="timer" id="timer" role="timer" aria-label="Time until liftoff on November 15, 2028, at midnight Pacific" aria-live="off">
      <span class="prefix" aria-hidden="true">T−</span>
      <div class="unit"><span class="digits" id="days">—</span><span class="label">DAYS</span></div>
      <span class="separator" aria-hidden="true">:</span>
      <div class="unit"><span class="digits" id="hours">—</span><span class="label">HOURS</span></div>
      <span class="separator" aria-hidden="true">:</span>
      <div class="unit"><span class="digits" id="minutes">—</span><span class="label">MINUTES</span></div>
      <span class="separator" aria-hidden="true">:</span>
      <div class="unit seconds"><span class="digits" id="seconds">—</span><span class="label">SECONDS</span></div>
    </div>
    <p class="liftoff" id="liftoff" role="status" hidden>LIFTOFF</p>
    <noscript>Enable JavaScript to see the countdown.</noscript>
  </main>
  <button class="motion" id="motion" type="button" aria-label="Pause background animation" hidden>
    <svg id="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h3v12H4zm5 0h3v12H9z"/></svg>
    <svg id="play-icon" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M4 2l10 6-10 6z"/></svg>
  </button>
  <script type="module">
    const TARGET = Date.parse("2028-11-15T00:00:00-08:00");
    function remaining(now = Date.now()) {
      const total = Math.max(0, Math.ceil((TARGET - now) / 1000));
      return { days: Math.floor(total / 86400), hours: Math.floor(total / 3600) % 24, minutes: Math.floor(total / 60) % 60, seconds: total % 60, done: total === 0 };
    }
    const units = ["days", "hours", "minutes", "seconds"];
    const fields = Object.fromEntries(units.map(unit => [unit, document.getElementById(unit)]));
    let interval;
    function update() {
      const value = remaining();
      for (const unit of units) {
        const text = String(value[unit]).padStart(unit === "days" ? 3 : 2, "0");
        if (fields[unit].textContent !== text) fields[unit].textContent = text;
      }
      document.getElementById("timer").hidden = value.done;
      document.getElementById("liftoff").hidden = !value.done;
      if (value.done && interval) { clearInterval(interval); interval = undefined; }
      return value.done;
    }
    if (!update()) interval = setInterval(update, 250);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) update(); });
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const background = document.getElementById("background");
    const motion = document.getElementById("motion");
    let playing = !reducedMotion.matches;
    function applyMotion() {
      background.src = playing ? "./falcon-venting.gif" : "./falcon-venting-still.jpg";
      motion.setAttribute("aria-label", playing ? "Pause background animation" : "Play background animation");
      document.getElementById("pause-icon").toggleAttribute("hidden", !playing);
      document.getElementById("play-icon").toggleAttribute("hidden", playing);
    }
    motion.hidden = false;
    motion.addEventListener("click", () => { playing = !playing; applyMotion(); });
    reducedMotion.addEventListener("change", () => { playing = !reducedMotion.matches; applyMotion(); });
    applyMotion();
  </script>
</body>
</html>
